name: 'Validate PROVENANCE.yml'
description: 'Validates and cryptographically verifies your PROVENANCE.yml against the Provenance protocol specification'
author: 'Provenance Protocol'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  file-path:
    description: 'Path to PROVENANCE.yml file'
    required: false
    default: 'PROVENANCE.yml'
  fail-on-error:
    description: 'Fail the build if validation fails'
    required: false
    default: 'true'
  verify-signature:
    description: 'Cryptographically verify identity.signature when present. Catches a declaration edited after it was signed.'
    required: false
    default: 'true'
  require-signature:
    description: 'Fail when the declaration carries no signature at all'
    required: false
    default: 'false'
  check-repository:
    description: 'Check that provenance_id names the repository this runs in. Catches a fork carrying the original declaration.'
    required: false
    default: 'true'

  check-code:
    description: "Compare the declaration with the project on every build (read locally, nothing sent anywhere, no key used). 'warn' (default) reports; 'suggest' opens a pull request with the facts applied on pushes to the default branch; 'automatic' commits them directly when the running service signs; 'strict' fails the build while anything is outstanding; 'off' skips it."
    required: false
    default: 'warn'
  signed-by:
    description: "Who signs the passport after an update: 'service' (provenance-middleware signs at start-up), 'developer' (sign locally before merging), or 'auto' (service for provenance:domain ids, developer otherwise)."
    required: false
    default: 'auto'
  github-token:
    description: 'Token used to open the pull request in suggest mode. The default workflow token is enough with permissions: contents: write and pull-requests: write.'
    required: false
    default: ${{ github.token }}
  release-private-key:
    description: 'Optional. The agent private key (use a secret). When set, issues a signed release notice tying this release to the declaration digest.'
    required: false
  release-version:
    description: 'Version for the release notice. Defaults to the tag name when the workflow runs on a tag.'
    required: false
  notify-urls:
    description: 'Optional. HTTPS endpoints of watchers you choose to receive the release notice, separated by commas or whitespace.'
    required: false

outputs:
  valid:
    description: 'Whether the PROVENANCE.yml is valid'
  errors:
    description: 'Validation errors, if any'
  release-notice:
    description: 'The signed release notice as JSON, when one was issued'
  signature:
    description: "Signature result: 'declaration' (0.2, whole file covered), 'identity' (0.1, identity only), 'invalid', or 'none'" 

runs:
  using: 'node20'
  main: 'dist/index.js'
